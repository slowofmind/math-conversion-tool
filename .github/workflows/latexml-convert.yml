# LaTeXML Conversion Pipeline
# Triggered when .tex files are committed to pipeline-input/
# Runs LaTeXML in Docker, commits HTML output to pipeline-output/
#
# The browser tool (index.html) commits files here via the GitHub API,
# then polls for completion and fetches the results.

name: LaTeXML Convert

on:
  push:
    paths:
      - 'pipeline-input/**'

permissions:
  contents: write
  packages: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify input files
        run: |
          echo "Files to process:"
          ls -lh pipeline-input/*.tex 2>/dev/null || echo "No .tex files found"

      - name: Create output directory
        run: mkdir -p pipeline-output

      - name: Run LaTeXML pipeline
        run: |
          docker run --rm \
            -e MODE=latexml \
            -v "${{ github.workspace }}/pipeline-input:/source" \
            -v "${{ github.workspace }}/pipeline-output:/output" \
            ghcr.io/slowofmind/latexml-pipeline:latest

      - name: Show output files
        run: ls -lh pipeline-output/

      - name: Commit results and clean up input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage output files
          git add pipeline-output/
          
          # Remove processed input files to keep repo clean
          git rm pipeline-input/*.tex 2>/dev/null || true
          
          # Commit with [skip ci] to prevent re-triggering
          git commit -m "LaTeXML conversion output [skip ci]" || echo "No changes to commit"
          git push
