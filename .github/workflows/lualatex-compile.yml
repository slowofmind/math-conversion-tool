# LuaLaTeX Compilation Pipeline
# Triggered when .tex files are committed to lualatex-pipeline-input/
# Runs LuaLaTeX in Docker, commits PDF to lualatex-pipeline-output/ and creates a Release.
#
# The browser tool fetches the PDF from lualatex-pipeline-output/ via the Contents API
# using Accept: application/vnd.github.raw (raw binary, no base64).
# The Release serves as a backup and direct-access point.

name: LuaLaTeX Compile

on:
  push:
    paths:
      - 'lualatex-pipeline-input/**'

permissions:
  contents: write
  packages: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify input files
        run: |
          echo "Files to compile:"
          ls -lh lualatex-pipeline-input/*.tex 2>/dev/null || echo "No .tex files found"

      - name: Create output directory
        run: mkdir -p lualatex-pipeline-output

      - name: Run LuaLaTeX pipeline
        run: |
          docker run --rm \
            -e MODE=lualatex \
            -v "${{ github.workspace }}/lualatex-pipeline-input:/source" \
            -v "${{ github.workspace }}/lualatex-pipeline-output:/output" \
            ghcr.io/slowofmind/latexml-pipeline:latest

      - name: Show output files
        run: ls -lh lualatex-pipeline-output/

      - name: Commit results and clean up input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage output files (PDF + logs)
          git add lualatex-pipeline-output/
          
          # Remove processed input files to keep repo clean
          git rm lualatex-pipeline-input/*.tex 2>/dev/null || true
          
          # Commit with [skip ci] to prevent re-triggering
          git commit -m "LuaLaTeX compilation output [skip ci]" || echo "No changes to commit"
          git push

      - name: Create release with PDF (backup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build a unique tag from the commit timestamp
          TAG="lualatex-$(date +%s)"
          
          # Find the PDF file(s)
          PDF_FILES=$(ls lualatex-pipeline-output/*.pdf 2>/dev/null)
          if [ -z "$PDF_FILES" ]; then
            echo "::warning::No PDF files produced"
            exit 0
          fi
          
          # Extract base name for the release title
          BASENAME=$(basename lualatex-pipeline-output/*.pdf .pdf 2>/dev/null | head -1)
          
          # Create the release with all PDF and log files attached
          gh release create "$TAG" \
            lualatex-pipeline-output/*.pdf \
            lualatex-pipeline-output/*-lualatex.log \
            lualatex-pipeline-output/*-engine.log \
            --title "LuaLaTeX: ${BASENAME}" \
            --notes "Compiled from ${BASENAME}.tex on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest=false \
            2>/dev/null || \
          gh release create "$TAG" \
            lualatex-pipeline-output/*.pdf \
            --title "LuaLaTeX: ${BASENAME}" \
            --notes "Compiled from ${BASENAME}.tex on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest=false \
            2>/dev/null || echo "::warning::Release creation failed (non-fatal)"
