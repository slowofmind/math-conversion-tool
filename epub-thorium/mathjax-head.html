<!-- ============================================================================
     mathjax-head.html — injected into every EPUB chapter head via pandoc -H.
     MathJax v4 (pinned 4.1.x), TeX input (pandoc mathjax spans), SVG output,
     physics extension, speech+braille via SRE running in a fully inlined
     worker (zero network inside the worker), plus Thorium/r2-navigator
     workarounds. Works offline; engine tree must be added to the container by
     postprocess-epub.py (EPUB/MathJax/).

     Status surface: document.documentElement data-mathjax-epub attribute
     (prefetching | ready | degraded-prefetch | degraded-patch) and
     [mathjax-epub] console lines.

     PINNED INTERNALS CAVEAT: the createWorker override patches an
     undocumented MathJax internal (HTMLAdaptor.prototype.createWorker).
     Verified against 4.1.2. Re-verify on any MathJax upgrade.
     ========================================================================= -->

<!-- 0. Math CSS. Kept inside this head snippet so the whole customization
     travels as ONE file: pandoc-wasm frontends expose header files (-H)
     but their css option can fail. Content mirrors math.css; the separate
     css flag is therefore optional/redundant on the CLI.
     (NB: never put a double hyphen inside these comments; XML forbids it.) -->
<style type="text/css">
mjx-container {
  break-inside: avoid;
  page-break-inside: avoid;
  -webkit-column-break-inside: avoid;
}
mjx-container[display="true"] {
  display: block;
  margin: 1em 0;
}
/* Placeholder: Thorium context-menu + subtitle-overlay tuning goes here. */
</style>

<!-- 1. Prefetch: pull worker + mathmaps into page memory (page context CAN
     read EPUB-internal URLs; workers cannot — hence this indirection). -->
<script type="text/javascript">
//<![CDATA[
(function () {
  'use strict';
  var TAG = '[mathjax-epub]';
  var root = document.documentElement;
  root.setAttribute('data-mathjax-epub', 'prefetching');

  var BASE = '../MathJax/';
  var FILES = {
    worker:        BASE + 'sre/speech-worker.js',
    'en.json':     BASE + 'sre/mathmaps/en.json',
    'base.json':   BASE + 'sre/mathmaps/base.json',
    'nemeth.json': BASE + 'sre/mathmaps/nemeth.json'
  };

  function xhrText(url) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onload = function () {
        if (x.status === 200 || (x.status === 0 && x.responseText)) resolve(x.responseText);
        else reject(new Error('XHR ' + x.status + ' for ' + url));
      };
      x.onerror = function () { reject(new Error('XHR network error for ' + url)); };
      x.send();
    });
  }
  function fetchText(url) {
    if (typeof fetch !== 'function') return xhrText(url);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).catch(function () { return xhrText(url); });
  }

  var store = { ready: false, workerSource: null, mathmaps: {}, promise: null };
  window.__mjxEpubAssets = store;
  store.promise = Promise.all(Object.keys(FILES).map(function (key) {
    return fetchText(FILES[key]).then(function (text) {
      if (key === 'worker') store.workerSource = text;
      else store.mathmaps[key] = text;
    });
  })).then(function () {
    store.ready = true;
    console.log(TAG + ' assets prefetched');
  }).catch(function (err) {
    root.setAttribute('data-mathjax-epub', 'degraded-prefetch');
    console.error(TAG + ' prefetch FAILED: ' + (err && err.message || err) +
      ' — speech/braille will be unavailable; rendering may still work.');
  });
})();
//]]>
</script>

<!-- 2. MathJax config: physics, a11y, inline-worker patch, pageReady gate,
     Thorium arrow-key + focus workarounds. -->
<script type="text/javascript">
//<![CDATA[
(function () {
  'use strict';
  var TAG = '[mathjax-epub]';
  var root = document.documentElement;

  // --- Thorium/r2-navigator focus guard -------------------------------------
  // Thorium reacts to focusin on document.body (reading-location update +
  // scroll-into-view) and yanks the view when the explorer focuses an
  // equation. Capture at document level fires first; stopPropagation keeps
  // equation focus page-internal. Inert in other readers.
  document.addEventListener('focusin', function (ev) {
    var el = ev.target;
    while (el && el.nodeType === 1) {
      if (el.tagName && el.tagName.toLowerCase() === 'mjx-container') {
        ev.stopPropagation();
        return;
      }
      el = el.parentNode;
    }
  }, true);

  // --- intent ClearSpeak rules ----------------------------------------------
  // Copied from filters/mathjax-intent-toggle.lua (RULES). These are the SRE
  // half of the intent layer: they match the ext-* carrier attributes that the
  // conversion-time device baked into the static MathML. The TeX-input half is
  // deliberately absent -- see mathjax-configuration-reference.md section 8.
  //
  //   * priority must be the LAST constraint, and above ~250 to beat built-ins
  //   * ARG stays STRICTLY descendant: a self-selecting [n] re-invokes speech
  //     on the same node -- infinite recursion, empty output (2026-08-09)
  //   * registered for clearspeak ONLY, so MathSpeak keeps reading verbatim
  var RULES_LOCALE = 'en';
  var ARG = function (n) { return './/*[@ext-argname="' + n + '"]'; };
  var PRIO = 'priority=1000';
  var INTENT_RULES = {};
  INTENT_RULES[RULES_LOCALE + '/rules/intent'] = {
    domain: 'clearspeak', locale: RULES_LOCALE, modality: 'speech',
    inherits: 'base',
    rules: [
      ['Rule', 'intent-arity0', 'default',
        '[t] @ext-open',
        'self::*[@ext-arity="0"]', PRIO],
      ['Rule', 'intent-arity1', 'default',
        '[t] @ext-open; [n] ' + ARG('a') + '; [t] @ext-close',
        'self::*[@ext-arity="1"]', PRIO],
      // MERGED arity-1: SRE's semantic collapse can fold a lone-token operand
      // into the wrapper node, so self carries BOTH ext-arity and ext-argname
      // and the descendant lookup finds nothing ("the vector" bug).
      ['Rule', 'intent-arity1-merged', 'default',
        '[t] @ext-open; [t] text(); [t] @ext-close',
        'self::*[@ext-arity="1"]', 'self::*[@ext-argname]', 'priority=1100'],
      ['Rule', 'intent-arity2', 'default',
        '[t] @ext-open; [n] ' + ARG('a') + '; [t] @ext-mid1; [n] ' + ARG('b') +
        '; [t] @ext-close',
        'self::*[@ext-arity="2"]', PRIO],
      ['Rule', 'intent-arity3', 'default',
        '[t] @ext-open; [n] ' + ARG('a') + '; [t] @ext-mid1; [n] ' + ARG('b') +
        '; [t] @ext-mid2; [n] ' + ARG('c') + '; [t] @ext-close',
        'self::*[@ext-arity="3"]', PRIO],
      // \speakas -- author's literal string; terminal, beats the concept rules.
      ['Rule', 'intent-say', 'default',
        '[t] @ext-say',
        'self::*[@ext-say]', 'priority=2000']
    ]
  };

  // --- createWorker override (MERGED: offline mathmaps + intent rules) -------
  function installWorkerPatch() {
    var store = window.__mjxEpubAssets;
    var HA;
    try { HA = MathJax._.adaptors.HTMLAdaptor.HTMLAdaptor; } catch (e) { HA = null; }
    if (!HA || !HA.prototype || typeof HA.prototype.createWorker !== 'function') {
      root.setAttribute('data-mathjax-epub', 'degraded-patch');
      console.error(TAG + ' createWorker not found — MathJax internals changed? ' +
        'Speech worker will attempt stock (network) path and likely fail in EPUB readers.');
      return false;
    }
    var original = HA.prototype.createWorker;
    HA.prototype.createWorker = function (listener, options) {
      try {
        if (!store || !store.workerSource) throw new Error('prefetched assets unavailable');
        var mapsJs = '{';
        var first = true;
        for (var name in store.mathmaps) {
          if (!store.mathmaps.hasOwnProperty(name)) continue;
          mapsJs += (first ? '' : ',') + JSON.stringify(name) + ':' + store.mathmaps[name];
          first = false;
        }
        mapsJs += '}';
        // Neutralise "<" so a stray "</script" cannot end the block early.
        function embed(v) { return JSON.stringify(v).replace(/</g, '\\u003c'); }
        var content =
          'self.maps = ' + JSON.stringify((options && options.maps) || '') + ';\n' +
          'self.__mathmaps = ' + mapsJs + ';\n' +
          'self.__intentRules = ' + embed(INTENT_RULES) + ';\n' +
          'self.__intentFile = ' + embed(RULES_LOCALE + '.json') + ';\n' +
          '(function () {\n' +
          '  var origFetch = self.fetch;\n' +
          '  self.fetch = function (url) {\n' +
          '    var m = String(url).match(/([^\\/\\\\]+\\.json)(\\?.*)?$/);\n' +
          '    if (m && self.__mathmaps[m[1]]) {\n' +
          '      var data = self.__mathmaps[m[1]];\n' +
          // NO bookkeeping keys in this object: SRE enumerates it and
          // dispatches every key as a rule set. Merging is idempotent.
          '      if (m[1] === self.__intentFile) {\n' +
          '        for (var k in self.__intentRules) data[k] = self.__intentRules[k];\n' +
          '      }\n' +
          '      return Promise.resolve({\n' +
          '        ok: true, status: 200,\n' +
          '        json: function () { return Promise.resolve(data); },\n' +
          '        text: function () { return Promise.resolve(JSON.stringify(data)); }\n' +
          '      });\n' +
          '    }\n' +
          '    console.log("[mathjax-epub worker] non-embedded request: " + url);\n' +
          '    if (origFetch) return origFetch.apply(self, arguments);\n' +
          '    return Promise.reject(new Error("no fetch for " + url));\n' +
          '  };\n' +
          '})();\n' +
          store.workerSource;
        var url = URL.createObjectURL(new Blob([content], { type: 'text/javascript' }));
        var w = new Worker(url);
        w.onmessage = listener;
        URL.revokeObjectURL(url);
        console.log(TAG + ' inline speech worker created; intent rules merged into ' +
                    RULES_LOCALE + '.json');
        return w;
      } catch (err) {
        console.error(TAG + ' inline worker failed (' + (err && err.message) + '); using stock method');
        return original.call(this, listener, options);
      }
    };
    return true;
  }

  // --- Thorium arrow-key opt-out ---------------------------------------------
  // r2-navigator treats any element whose ancestor chain carries a
  // contenteditable attribute (value irrelevant) as owning its arrow keys.
  // contenteditable="false" is editing-inert everywhere.
  function optOutOfArrowCapture() {
    var nodes = document.querySelectorAll('mjx-container');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('contenteditable', 'false');
    }
  }

  window.MathJax = {
    loader: {
      // All four resolve from ../MathJax/ inside the container (no network).
      //   a11y/explorer      declares the options.a11y defaults, INCLUDING
      //                      subtitles and viewBraille. Without it those keys
      //                      are rejected at config time and the subtitle
      //                      region never shows. Not optional.
      //   a11y/assistive-mml provides the hidden-MathML mode reached from the
      //                      context menu -- the MathCAT route and the
      //                      no-speech fallback. The HTML path loads it; this
      //                      one previously did not.
      load: ['a11y/explorer', 'a11y/assistive-mml', '[tex]/physics']
    },
    tex: {
      // NOTE: physics rebinds \div (division sign -> divergence operator).
      // If a document needs ÷, shadow it via macros here or drop physics for
      // that conversion. See mathjax-intent-extension docs §5.1.
      packages: { '[+]': ['physics'] }
    },
    options: {
      // TWO NAMESPACES -- see ../../mathjax-configuration-reference.md
      //
      // menuOptions.settings = MenuSettings, declared in ui/menu/Menu.ts.
      //   Only keys in that static list may be set here (speech, braille,
      //   enrich, assistiveMml, speechRules, collapsible, ...).
      //
      // a11y = document options, declared in a11y/explorer.ts OPTIONS.a11y
      //   (subtitles, viewBraille, voicing, magnification, highlight, ...).
      //   Requires a11y/explorer in loader.load above.
      //
      // Setting a key in the wrong namespace logs
      //   Invalid option "<key>" (no default value)
      // and the value is silently discarded -- the feature just never turns on.
      // FIXED 2026-08-14: subtitles/braille were previously all under a11y
      // with no explorer loaded, so subtitles and braille display were dead.
      menuOptions: {
        settings: {
          enrich:       true,   // gates speech/braille/explorer
          speech:       true,   // MathJax voices each expression
          braille:      true,   // generate braille
          assistiveMml: false   // hidden MathML off by default; menu turns it on
        }
      },
      a11y: {
        subtitles:   true,      // speech shown on screen while exploring
        viewBraille: false      // braille shown as subtitles; off by default
      }
    },
    startup: {
      ready: function () {
        installWorkerPatch();
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(function () {
          optOutOfArrowCapture();
          if (root.getAttribute('data-mathjax-epub') === 'prefetching') {
            root.setAttribute('data-mathjax-epub', 'ready');
          }
          console.log(TAG + ' typeset complete; version ' + (MathJax.version || '?'));
        });
      },
      pageReady: function () {
        // Gate typesetting on the prefetch so the worker is never created
        // before its source is in memory.
        return window.__mjxEpubAssets.promise.then(function () {
          return MathJax.startup.defaultPageReady();
        });
      }
    }
  };
})();
//]]>
</script>
