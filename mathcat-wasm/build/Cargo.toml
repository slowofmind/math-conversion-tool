# Thin JS-facing wrapper over MathCAT's public Rust interface.
# Plan: PLAN-MATHCAT-SPEECH-PROOFING.md, section 2.2 (M9: speech functions only).
[package]
name = "mathcat_wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the MathCAT inside the NVDA add-on 0.7.7 (Nicholas, 2026-11-05 and
# 2026-11-09; mathcat-proofing-v2/NOTE-MATHCAT-UPGRADE-0.7.7.md). Change only via
# VERSIONS.md "Updating to a new pin"; the rules gate in build-container.sh
# checks the pin against the Add-on Store's package.
mathcat = { version = "=0.7.7", features = ["include-zip"] }
# Must equal the wasm-bindgen CLI version used by build-container.sh.
wasm-bindgen = "=0.2.128"

# No [build-dependencies]: MathCAT 0.7.7 enables both zip compressions itself,
# so the zip fix that 0.7.2 needed (plan Appendix A) and its empty build.rs
# were removed.

[profile.release]
lto = true
opt-level = "z"
